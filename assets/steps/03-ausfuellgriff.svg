<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Ausfüllgriff in der GeoGebra-Tabelle</title>
  <desc id="desc">Die Zelle C1 ist lila markiert. Am unteren rechten Eck sitzt der Ausfüllgriff. Ein Hinweis erklärt, dass man ihn auf dem iPad lange festhalten und den lila Bereich nach unten ziehen muss.</desc>
  <rect width="1000" height="620" fill="#f7f5ff"/>
  <image x="0" y="0" width="710" height="613" preserveAspectRatio="none" xlink:href="03-punkte-ausfuellen.png"/>
  <rect x="463" y="145" width="140" height="104" rx="5" fill="#8b5cf6" fill-opacity="0.16" stroke="#6d45d8" stroke-width="5"/>
  <circle cx="603" cy="249" r="10" fill="#6d45d8" stroke="#ffffff" stroke-width="4"/>
  <path d="M603 249 C670 260 700 285 742 315" fill="none" stroke="#6d45d8" stroke-width="5" stroke-linecap="round"/>
  <path d="M732 301 L750 320 L724 321" fill="none" stroke="#6d45d8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="750" y="236" width="226" height="176" rx="18" fill="#ffffff" stroke="#d7cdfc" stroke-width="3"/>
  <text x="773" y="274" fill="#3d287e" font-family="Arial, sans-serif" font-size="25" font-weight="700">Ausfüllgriff</text>
  <text x="773" y="311" fill="#39334d" font-family="Arial, sans-serif" font-size="20">Auf dem iPad lange</text>
  <text x="773" y="340" fill="#39334d" font-family="Arial, sans-serif" font-size="20">festhalten. Dann den</text>
  <text x="773" y="369" fill="#39334d" font-family="Arial, sans-serif" font-size="20">lila Bereich nach unten</text>
  <text x="773" y="398" fill="#39334d" font-family="Arial, sans-serif" font-size="20">bis C6 ziehen.</text>
</svg>
